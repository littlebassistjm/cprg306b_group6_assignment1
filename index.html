<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body
class="min-h-screen bg-cover bg-center bg-no-repeat"
style="background-image: url('./images/background.png');">
    <header>
        <nav class="bg-emerald-900/80 backdrop-blur-md text-white">
            <div class="container mx-auto">
                <ul class="flex">
                    <li>
                        <button
                            id="weight-tab"
                            class="px-6 py-4 rounded-lg transition duration-300 hover:bg-emerald-500">
                            Weight
                        </button>
                        <button
                            id="distance-tab"
                            class="px-6 py-4 rounded-lg transition duration-300 hover:bg-emerald-500">
                            Distance
                        </button>
                        <button
                            id="temperature-tab"
                            class="px-6 py-4 rounded-lg transition duration-300 hover:bg-emerald-500">
                            Temperature
                        </button>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container mx-auto p-6">

        <!-- Weight section -->
        <section 
            id="weight-section">
            <div class="bg-white rounded-xl shadow-xl p-6">
                <h2 class="text-2xl font-bold mb-6">
                    Weight Converter
                </h2>

                <label class="block mb-2">
                    Conversion Type
                </label>

                <select id="weight-conversion" class="w-full border rounded-lg px-4 py-2 mb-4">
                    <option value="poundsToKilograms">
                        Pounds -> Kilograms
                    </option>
                    <option value="kilogramsToPounds">
                        Kilograms -> Pounds
                    </option>
                </select>

                <label class="block mb-2">
                    Single Value
                </label>

                <input type="number" id="weight-single-input" class="w-full border rounded-lg px-4 py-2 mb-4">

                <button id="weight-single-button" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">
                    Convert Single Value
                </button>

                <hr class="my-6">

                <label class="block mb-2">
                    Array Values (comma separated)
                </label>

                <input type="text" id="weight-array-input" placeholder="10, 20, 30" class="w-full border rounded-lg px-4 py-2 mb-4">

                <button id="weight-array-button" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">
                    Convert Array
                </button>

                <div id="weight-result" class="mt-6 text-xl font-bold text-emerald-700"></div>
            </div>
        </section>

        <!-- Distance section -->
        <section 
            id="distance-section"
            class="hidden">
            <div class="bg-white rounded-xl shadow-xl p-6">
                <h2 class="text-2xl font-bold mb-6">
                    Distance Converter
                </h2>

                <label class="block mb-2">
                    Conversion Type
                </label>

                <select id="distance-conversion" class="w-full border rounded-lg px-4 py-2 mb-4">
                    <option value="milesToKilometers">
                        Miles -> Kilometers
                    </option>
                    <option value="kilometersToMiles">
                        Kilometers -> Miles
                    </option>
                </select>

                <label class="block mb-2">
                    Single Value
                </label>

                <input type="number" id="distance-single-input" class="w-full border rounded-lg px-4 py-2 mb-4">

                <button id="distance-single-button" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">
                    Convert Single Value
                </button>

                <hr class="my-6">

                <label class="block mb-2">
                    Array Values (comma separated)
                </label>

                <input type="text" id="distance-array-input" placeholder="10, 20, 30" class="w-full border rounded-lg px-4 py-2 mb-4">

                <button id="distance-array-button" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">
                    Convert Array
                </button>

                <div id="distance-result" class="mt-6 text-xl font-bold text-blue-700"></div>
            </div>
        </section>

        <!-- Temperature section -->
        <section 
            id="temperature-section"
            class="hidden">

            <div class="bg-white rounded-xl shadow-xl p-6">
                <h2 class="text-2xl font-bold mb-6"> Temperature Converter</h2>
                <label class="block mb-2"> Conversion Type</label>
                <select id="temperature-conversion" class="w-full border rounded-lg px-4 py-2 mb-4">
                    <option value="celsiusToFahrenheit">
                        Celsius -> Fahrenheit</option>
                    <option value="fahrenheitToCelsius">
                        Fahrenheit -> Celsius</option>
                </select>
                <label class="block mb-2"> Single Value</label>
                <input
                    type="number"
                    id="temperature-single-input"
                    class="w-full border rounded-lg px-4 py-2 mb-4 ">
                <button
                    id="temperature-single-button"
                    class="bg-emerald-600 text-white px-4 py-2 rounded-lg"> Convert Single Value</button>
                <hr class="my-6">
                <label class="block mb-2"> Array Values (comma separated)</label>
                <input
                    type="text"
                    id="temperature-array-input"
                    placeholder="0, 50, 100"
                    class="w-full border rounded-lg px-4 py-2 mb-4">
                <button
                    id="temperature-array-button"
                    class="bg-emerald-600 text-white px-4 py-2 rounded-lg"> Convert Array</button>
                <div 
                    id="temperature-result"
                    class="mt-6 text-xl font-bold text-emerald-700"></div>
            </div>
        </section>
    </main>
    <script type="module" src="./dist/main.js"></script>
</body>
</html>
