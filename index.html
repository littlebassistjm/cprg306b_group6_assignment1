<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>

    <script src=""></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <header>
        <nav class="bg-blue-700 text-white">
            <div class="container mx-auto">
                <ul class="flex">
                    <li>
                        <button
                            id="weight-tab"
                            class="px-6 py-4 hover:bg-blue-600">
                            Weight
                        </button>
                        <button
                            id="weight-tab"
                            class="px-6 py-4 hover:bg-blue-600">
                            Distance
                        </button>
                        <button
                            id="weight-tab"
                            class="px-6 py-4 hover:bg-blue-600">
                            Temperature
                        </button>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container mx-auto p-6">

        <!-- Weight section -->
        <section 
            id=""weight-section>
            <div class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-2xl font-bold mb-6">
                    Weight Converter
                </h2>

                <label class="block mb-2">
                    Conversion Type
                </label>

                <select id="weight-conversion" class="w-full border rounded-lg px-4 py-2 mb-4">
                    <option value="poundsToKilograms">
                        Pounds -> Kilograms
                    </option>
                    <option value="kilogramsToPounds">
                        Kilograms -> Pounds
                    </option>
                </select>

                <label class="block mb-2">
                    Single Value
                </label>

                <input type="number" id="weight-single-input" class="w-full border rounded-lg px-4 py-2 mb-4">

                <button id="weight-single-button" class="bg-blue-600 text-white px-4 py-2 rounded-lg">
                    Convert Single Value
                </button>

                <hr class="my-6">

                <label class="block mb-2">
                    Array Values (comma separated)
                </label>

                <input type="text", id="weight-array-input" placeholder="10, 20, 30" class="w-full border rounded-lg px-4 py-2 mb-4">

                <button id="weight-array-button" class="bg-blue-600 text-white px-4 py-2 rounded-lg">
                    Convert Array
                </button>

                <div id="weight-result" class="mt-6 text-xl font-bold text-blue-700"></div>
            </div>
        </section>

        <!-- Distance section -->
        <section 
            id="distance-section"
            class="hidden">
        </section>

        <!-- Temperature section -->
        <section 
            id="temperature-section"
            class="hidden">
        </section>
    </main>
    <script src="./dist/main.js"></script>
</body>
</html>
